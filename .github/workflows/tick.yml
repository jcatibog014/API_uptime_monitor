# Pulse Check's backup timer. Render's free plan sleeps after 15 minutes
# without a visitor, and a sleeping site checks nothing. Pulse Check keeps
# itself awake (its crew checks its own address every minute), but after a
# restart or a deploy it may sleep until someone visits. So GitHub calls the
# site every 10 minutes (free for public repos): each call wakes it, runs
# whatever checks are due, and tidies up (pulsecheck/tick.py). GitHub can run
# a few minutes late; the missed minutes show as a gap, not as downtime.
#
# Set two repository secrets (GitHub: Settings > Secrets and variables > Actions):
#   TICK_URL  https://<your-site>.onrender.com/tasks/tick
#   TICK_KEY  the same value as TICK_KEY in Render's environment
# Until they are set, this does nothing.
name: Pulse Check timer

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the timer
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          TICK_KEY: ${{ secrets.TICK_KEY }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$TICK_KEY" ]; then
            echo "TICK_URL and TICK_KEY aren't set yet: nothing to do."
            exit 0
          fi
          # The first call can take ~50 s while Render wakes the site up.
          curl --fail --silent --show-error --max-time 120 -X POST -H "X-Tick-Key: $TICK_KEY" "$TICK_URL"
